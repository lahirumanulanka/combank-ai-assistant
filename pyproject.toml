[project]
name = "combank-ai-assistant"
version = "0.1.0"
description = "Enterprise knowledge assistant for Commercial Bank (assessment project)"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=1.30.0",
    "openai>=3.46.0",
    "pinecone>=10.3.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "streamlit>=1.67.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
